<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cubos IF</title>

    <link rel="stylesheet" href="css/estilos.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

</head>

<body>

<h1>Simulación Cubos IF</h1>

<div id="modoOscuroToggle">
    <label class="switch">
        <input type="checkbox" id="darkModeSwitch">
        <span class="slider"></span>
    </label>
    <span class="modo-texto">Modo oscuro</span>
</div>

<div id="formulario">
    <label data-tooltip="Año en el que comienza la simulación. Se usa para calcular el año real de cada mes.">
    Año inicial:
</label>
<input id="anioInicial" type="number" value="2030">

<label data-tooltip="Saldo inicial del Cubo 1. Este cubo cubre los retiros mensuales.">
    Cubo 1 inicial:
</label>
<input id="c1Inicial" type="number" value="50000">

<label data-tooltip="Saldo inicial del Cubo 2. Crece con rentabilidad anual y puede rebalancearse hacia Cubo 1.">
    Cubo 2 inicial:
</label>
<input id="c2Inicial" type="number" value="150000">

<label data-tooltip="Saldo inicial del Cubo 3. Crece con rentabilidades anuales y puede rebalancearse hacia Cubo 2.">
    Cubo 3 inicial:
</label>
<input id="c3Inicial" type="number" value="200000">

<label data-tooltip="Retiro mensual inicial. Se ajusta cada año por inflación.">
    Retiro mensual:
</label>
<input id="retiro" type="number" value="1500">

<label data-tooltip="Incremento mensual de efectivo procedente de una fuente externa que se añade al Cubo 1 antes del retiro.">
    Aporte externo mensual:
</label>
<div class="aporte-externo-control">
    <input id="aporteExterno" type="number" value="0">
    <label class="checkbox-label" for="inflacionAporte">
        <input id="inflacionAporte" type="checkbox">
        Aplicar inflación anual
    </label>
</div>

<label data-tooltip="Inflación anual aplicada al retiro mensual. Ejemplo: 0.04 = 4%.">
    Inflación anual:
</label>
<input id="inflacion" type="number" step="0.01" value="0.04">

<label data-tooltip="Rentabilidad anual del Cubo 2. Se aplica cada diciembre. Ejemplo: 0.03 = 3%.">
    Rentabilidad C2:
</label>
<input id="rentabC2" type="number" step="0.01" value="0.03">

<label data-tooltip="Número de meses que cada cubo debe cubrir. Se usa para calcular mínimos.">
    Meses a cubrir:
</label>
<input id="mesesCubrir" type="number" value="24">

<label data-tooltip="Saldo mínimo permitido en Cubo 3. El rebalanceo 3→2 nunca lo deja por debajo de este valor.">
    Mínimo Cubo 3:
</label>
<input id="minimoC3" type="number" value="500000">

<label data-tooltip="Lista de rentabilidades anuales del Cubo 3 separadas por ';'. Una por cada año de simulación. Ejemplo para simulación de 3 años con rentabilidades 5%,-3% y 7% = 0,05;-0,03;0,07">
    Rentab. anuales Cubo 3:
</label>
<input id="rentabC3" type="text" value="0,0073;0,0418;0,0316;-0,0907;0,1368;-0,0081;0,2110;0,0263;0,1308;0,0738;0,1694;0,0799">


    <button id="btnSimular">Simular</button>
</div>

<hr>

<h2>Gráficos</h2>

<div class="panel-graficos">
    <canvas id="graficoC1C2"></canvas>
    <canvas id="graficoC3"></canvas>
</div>

<!-- Eliminado gráfico Pie -->
<!--h2>Distribución final</h2>
<canvas id="graficoPie"></canvas-->

<h2>Resultados</h2>
<div id="exportButtons">
    <button id="btnExcel">📊 Exportar a Excel</button>
    <button id="btnPDF">📄 Exportar a PDF</button>
</div>
<table id="tablaResultados"></table>

<script src="js/utils.js"></script>
<script src="js/modelos.js"></script>
<script src="js/simulacion.js"></script>
<script src="js/graficos.js"></script>
<script src="js/tabla.js"></script>
<script src="js/ui.js"></script>

</body>
</html>
